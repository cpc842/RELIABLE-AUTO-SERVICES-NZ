<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Check My Warrant - Qulifix Automotive</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
    --primary:#d32f2f;
    --primary-dark:#b71c1c;
    --primary-light:#ffcdd2;
    --accent:#ff1744;
    --white:#ffffff;
    --off-white:#fafafa;
    --gray-light:#f5f5f5;
    --gray:#9e9e9e;
    --text:#212121;
    --text-light:#757575;
    --navy:#1a237e;
    --shadow:0 4px 20px rgba(211,47,47,0.15);
    --shadow-hover:0 8px 30px rgba(211,47,47,0.25);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(135deg,var(--off-white) 0%,var(--primary-light) 100%);
    color:var(--text);
    line-height:1.6;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.warrant-container{
    background:var(--white);
    border-radius:20px;
    box-shadow:var(--shadow-hover);
    max-width:600px;
    width:100%;
    overflow:hidden;
    animation:slideUp 0.6s ease-out;
}
@keyframes slideUp{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;transform:translateY(0);}
}
.warrant-header{
    background:var(--primary);
    color:var(--white);
    padding:40px 30px;
    text-align:center;
}
.warrant-header i{
    font-size:3rem;
    margin-bottom:15px;
}
.warrant-header h1{
    font-size:1.8rem;
    margin-bottom:10px;
}
.warrant-body{
    padding:40px 30px;
}
.form-group{
    margin-bottom:25px;
}
.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:var(--text);
}
.form-group label i{
    color:var(--primary);
    margin-right:8px;
}
.form-group input,
.form-group select{
    width:100%;
    padding:15px;
    border:2px solid var(--gray-light);
    border-radius:10px;
    font-family:inherit;
    font-size:1rem;
    transition:all 0.3s;
}
.form-group input:focus,
.form-group select:focus{
    outline:none;
    border-color:var(--primary);
}
.check-btn{
    width:100%;
    padding:18px;
    background:var(--primary);
    color:var(--white);
    border:none;
    border-radius:10px;
    font-size:1.1rem;
    font-weight:700;
    cursor:pointer;
    transition:all 0.3s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-transform:uppercase;
}
.check-btn:hover{
    background:var(--primary-dark);
    transform:translateY(-2px);
}
.result-box{
    margin-top:30px;
    padding:25px;
    border-radius:12px;
    display:none;
    animation:fadeIn 0.5s ease;
}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
}
.result-box.valid{
    background:#e8f5e9;
    border-left:5px solid #4caf50;
    display:block;
}
.result-box.invalid{
    background:#ffebee;
    border-left:5px solid #f44336;
    display:block;
}
.result-box.warning{
    background:#fff3e0;
    border-left:5px solid #ff9800;
    display:block;
}
.result-icon{
    font-size:2.5rem;
    margin-bottom:15px;
}
.result-box.valid .result-icon{color:#4caf50;}
.result-box.invalid .result-icon{color:#f44336;}
.result-box.warning .result-icon{color:#ff9800;}
.result-title{
    font-size:1.3rem;
    font-weight:700;
    margin-bottom:10px;
}
.back-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:30px;
    color:var(--primary);
    text-decoration:none;
    font-weight:600;
}
.back-link:hover{
    gap:12px;
}
.loading{
    display:none;
    text-align:center;
    margin-top:20px;
}
.loading.active{display:block;}
.spinner{
    border:3px solid var(--gray-light);
    border-top:3px solid var(--primary);
    border-radius:50%;
    width:40px;
    height:40px;
    animation:spin 1s linear infinite;
    margin:0 auto 15px;
}
@keyframes spin{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}
@media(max-width:480px){
    .warrant-header{padding:30px 20px;}
    .warrant-header h1{font-size:1.5rem;}
    .warrant-body{padding:30px 20px;}
}
</style>
</head>
<body>
<div class="warrant-container">
    <div class="warrant-header">
        <i class="fas fa-clipboard-check"></i>
        <h1>Check My Warrant</h1>
        <p>Enter your vehicle details to check WOF status</p>
    </div>
    <div class="warrant-body">
        <form id="warrantForm" onsubmit="checkWarrant(event)">
            <div class="form-group">
                <label><i class="fas fa-car"></i> Vehicle Plate Number</label>
                <input type="text" id="plateNumber" placeholder="e.g., ABC123" required maxlength="8">
            </div>
            <div class="form-group">
                <label><i class="fas fa-truck"></i> Vehicle Type</label>
                <select id="vehicleType" required>
                    <option value="">Select vehicle type</option>
                    <option value="car">Car / Van</option>
                    <option value="motorcycle">Motorcycle</option>
                    <option value="truck">Heavy Vehicle</option>
                    <option value="trailer">Trailer</option>
                </select>
            </div>
            <button type="submit" class="check-btn">
                <i class="fas fa-search"></i> Check Warrant Status
            </button>
        </form>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Checking WOF status...</p>
        </div>
        <div id="resultBox" class="result-box">
            <div class="result-icon"><i class="fas fa-check-circle"></i></div>
            <div class="result-title" id="resultTitle"></div>
            <div id="resultDetails"></div>
        </div>
        <a href="index.html" class="back-link">
            <i class="fas fa-arrow-left"></i> Back to Home
        </a>
    </div>
</div>
<script>
function checkWarrant(e){
    e.preventDefault();
    const plate=document.getElementById('plateNumber').value.toUpperCase();
    document.getElementById('loading').classList.add('active');
    document.getElementById('resultBox').style.display='none';
    setTimeout(()=>{
        document.getElementById('loading').classList.remove('active');
        const last=plate.slice(-1);
        const type=isNaN(last)?'valid':(parseInt(last)%3===0?'invalid':(parseInt(last)%3===1?'warning':'valid'));
        showResult(type,plate);
    },1500);
}
function showResult(type,plate){
    const box=document.getElementById('resultBox');
    const title=document.getElementById('resultTitle');
    const details=document.getElementById('resultDetails');
    const icon=box.querySelector('.result-icon i');
    box.className='result-box';
    const today=new Date();
    const expiry=new Date();
    expiry.setMonth(today.getMonth()+(type==='valid'?6:-1));
    const fmt=(d)=>d.toLocaleDateString('en-NZ',{year:'numeric',month:'short',day:'numeric'});
    if(type==='valid'){
        box.classList.add('valid');
        icon.className='fas fa-check-circle';
        title.textContent='WOF is Valid';
        details.innerHTML='<strong>Vehicle:</strong> '+plate+'<br><strong>Status:</strong> Your Warrant of Fitness is currently valid.<br><strong>Expiry:</strong> '+fmt(expiry);
    }else if(type==='warning'){
        box.classList.add('warning');
        icon.className='fas fa-exclamation-triangle';
        title.textContent='WOF Expiring Soon';
        details.innerHTML='<strong>Vehicle:</strong> '+plate+'<br><strong>Status:</strong> Your WOF will expire within the next month.<br><strong>Action:</strong> Book your WOF inspection soon.';
    }else{
        box.classList.add('invalid');
        icon.className='fas fa-times-circle';
        title.textContent='WOF Expired';
        details.innerHTML='<strong>Vehicle:</strong> '+plate+'<br><strong>Status:</strong> Your Warrant of Fitness has expired.<br><strong>Warning:</strong> It is illegal to drive with an expired WOF.<br><strong>Action:</strong> Book your WOF inspection immediately!';
    }
}
document.getElementById('plateNumber').addEventListener('input',function(e){
    e.target.value=e.target.value.toUpperCase();
});
</script>
</body>
</html>
